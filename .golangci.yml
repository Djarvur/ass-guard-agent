# golangci-lint v2 strict configuration
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: "5m"
  modules-download-mode: "readonly"

linters:
  default: all
  disable:
    - wsl            # Deprecated (v2.2.0); replaced by wsl_v5
    - wsl_v5         # 24-01 baseline repair: the rename (golangci 2.13) silently
                    # re-enabled the successor under default:all — same verdict
                    # as the original wsl disable (STATE.md LINT BASELINE note)
    - gomodguard     # Deprecated (v2.12.0); replaced by gomodguard_v2
    - gomodguard_v2  # 24-01 baseline repair: same rename re-enable as wsl_v5
    - noinlineerr    # 24-01 baseline repair: new in golangci 2.13; contradicts
                    # the house inline-err style (see internal/session/transcript.go)
                    # and was never part of a green gate's linter set
    - modernize      # 24-01 baseline repair: new gopls checks (errorsastype,
                    # stringsseq, waitgroupgo) fire on the pre-Phase-24 baseline
                    # (e.g. dispatch.go errors.As); never vetted by this config

  settings:
    depguard:
      rules:
        Main:
          list-mode: lax
          deny:
            - pkg: "unsafe"
              desc: "unsafe breaks the static-binary + memory-safety guarantees"
    gocyclo:
      min-complexity: 20
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 30
    varnamelen:
      min-name-length: 1
      ignore-names:
        - i
        - j
        - k
        - v
        - r
        - w
        - id
        - ok
        - err
        - ctx
        - t
        - db
        - tc
        - ch
        - fr
    lll:
      line-length: 120
      tab-width: 4
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: var-naming
    dupl:
      threshold: 120
    nestif:
      min-complexity: 6
    prealloc:
      simple: true
      for-loops: true

  exclusions:
    presets:
      - common-false-positives
    paths:
      - "spikes"        # Phase 0 throwaway spikes — not production code
      - "vendor"
      - "third_party"
    rules:
      # Relax errcheck in test files for common patterns
      - linters: [errcheck]
        path: ".*_test\\.go"
        text: ".*(defer .*\\.Close|defer .*\\.Rollback|fmt\\.Fprint|os\\.Setenv)"
      # Relax unparam in test code
      - linters: [unparam]
        path: ".*_test\\.go"
      # Relax dupl in test fixtures
      - linters: [dupl]
        path: ".*_test\\.go"
      # Relax gosec in test code
      - linters: [gosec]
        path: ".*_test\\.go"
      # Relax exhaustruct everywhere (too noisy for structs with optional fields).
      # 24-01 baseline repair: golangci 2.13 renamed exhaustruct -> exhaustruct_v5,
      # so the old exclusion silently stopped matching (STATE.md LINT BASELINE note).
      - linters: [exhaustruct, exhaustruct_v5]
        text: ".*"
      # Allow unchecked errors in main() init paths
      - linters: [errcheck]
        path: "cmd/.*"
        text: ".*(fmt\\.Println|os\\.Exit|log\\.Fatal)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - "github.com/Djarvur/ass-guard-agent"

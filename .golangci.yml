# golangci-lint v2 strict configuration
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: "5m"
  modules-download-mode: "readonly"

linters:
  default: all

  settings:
    gocyclo:
      min-complexity: 20
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: var-naming
    dupl:
      threshold: 120
    nestif:
      min-complexity: 6
    prealloc:
      simple: true
      for-loops: true

  exclusions:
    presets:
      - common-false-positives
    paths:
      - "spikes"        # Phase 0 throwaway spikes — not production code
      - "vendor"
      - "third_party"
    rules:
      # Relax errcheck in test files for common patterns
      - linters: [errcheck]
        path: ".*_test\\.go"
        text: ".*(defer .*\\.Close|defer .*\\.Rollback|fmt\\.Fprint|os\\.Setenv)"
      # Relax unparam in test code
      - linters: [unparam]
        path: ".*_test\\.go"
      # Relax dupl in test fixtures
      - linters: [dupl]
        path: ".*_test\\.go"
      # Relax gosec in test code
      - linters: [gosec]
        path: ".*_test\\.go"
      # Relax exhaustruct everywhere (too noisy for structs with optional fields)
      - linters: [exhaustruct]
        text: ".*"
      # Allow unchecked errors in main() init paths
      - linters: [errcheck]
        path: "cmd/.*"
        text: ".*(fmt\\.Println|os\\.Exit|log\\.Fatal)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - "github.com/Djarvur/ass-guard-agent"

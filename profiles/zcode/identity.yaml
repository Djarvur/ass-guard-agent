# The 12 zcode identity header NAMES (TIER-2 structural — VERIFIED-FACTS.md item #1).
# Values are per-session ephemera (TIER-3) and templated — never stored verbatim (T-01-02).
# <auth> renders to the operator's bearer token at request time (from ZAI_API_KEY).
headers:
  - name: HTTP-Referer
    value_template: "<referer>"
  - name: User-Agent
    value_template: "<user-agent>"
  - name: X-Os-Category
    value_template: "<os-category>"
  - name: X-Os-Version
    value_template: "<os-version>"
  - name: X-Platform
    value_template: "<platform>"
  - name: X-Title
    value_template: "<title>"
  - name: X-ZCode-Agent
    value_template: "<zcode-agent>"
  - name: X-ZCode-App-Version
    value_template: "<zcode-app-version>"
  - name: x-query-id
    value_template: "<query-id>"
  - name: x-request-id
    value_template: "<request-id>"
  - name: x-session-id
    value_template: "<session-id>"
  - name: x-zcode-trace-id
    value_template: "<trace-id>"

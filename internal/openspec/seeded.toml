# seeded.toml — the embedded zero-config OpenSpec config floor (OPEN-02). The
# engine loads this default when no operator overlay is present; operators
# override via the TOML loader. Seeded from real OpenSpec handoff examples.
#
# [[patterns]] — assistant-text regex → action (the engine's dual-signal text
#   half, D-02). The engine continues the SDD scenario when the assistant's
#   output matches one of these handoff patterns. (08-06 owns re-seeding these
#   from captured real stage-end output.)
#
#   08-06 chaining row format (D-12) — ids are stage-bearing and rows carry
#   the next /opsx:* command injected on match (the injection expands through
#   the 08-04 seam: provenance + mutating-command boundary like a typed
#   command):
#
#   [[patterns]]
#   id = "post-propose-handoff"          # post-<stage>-... selects the hook stage
#   regex = "<from CAPTURED stage-end output, never command-file prose>"
#   action = "continue"
#   next = "/opsx:apply"                 # empty = the generic continue prompt
#
#   The final archive stage matches NOTHING (the chain ends naturally).
# [[handoff_tools]] — tool-call name → action (the dual-signal tool half).
# [commands] — command → classification (D-15 / OPEN-03, the boundary source of
#   truth). Every entry runs as a subprocess via the Adapter with
#   OPEN_SPEC_INTERACTIVE=0 + nil stdin + per-command timeout.
#
# [commands] SOURCE OF TRUTH: the INSTALLED binary's probe (v1.5.0 on this
# machine, captured 2026-08-14 from `openspec --help` — NEVER the moving npm
# main, whose surface differs). Keys are hyphenated tool-name suffixes; `argv`
# carries the exact subprocess argv prefix when it differs from the key
# (e.g. key "new-change" → argv "new change"). Human-only commands (view,
# workset open, config edit, feedback, completion) are NEVER registered.
# RE-PROBE PROCEDURE on binary upgrades: run
#   ASSGUARD_OPENSPEC_BIN=1 go test ./internal/openspec/ -run TestSurfaceMatchesInstalledBinary
# — a mismatch fails with a diff naming the stale entries (Pitfall 7.2).

# ---- 08-06 T3 chaining rows — RE-SEEDED FROM THE REAL CAPTURE (D-12) ----
# Source: cmd/ass-guard/testdata/opsx-e2e/stage-{1,2,3}-output-capture.txt
# Capture run: 2026-08-15T13:29Z, gated E2E capture mode (real openspec 1.5.0
# binary + real GLM-5.2 via the Z.ai Anthropic endpoint), full
# explore→propose→apply→archive scenario, 505s. Regexes anchor on the stable
# phrase FAMILY the model emits across runs (verified against BOTH 2026-08-15
# gated runs' closings): propose names `/opsx:apply`, apply names
# `/opsx:archive`, explore closings reference the upcoming `proposal` — never
# command-file prose. Row ORDER is load-bearing (first match wins): the
# archive-terminal shield must precede post-explore because the ARCHIVE closing
# also contains the word "proposal" (its artifact list) — the shield ends the
# chain there; post-propose/post-apply precede post-explore because those
# closings also say "proposal". Operator overlays adjust without code (D-12).

# The terminal shield: the archive closing ends the chain (wait = no injection,
# flows through unchanged).
[[patterns]]
id = "post-archive-terminal"
regex = "(?i)archive complete"
action = "wait"

[[patterns]]
id = "post-propose-handoff"
regex = "/opsx:apply"
action = "continue"
next = "/opsx:apply"

[[patterns]]
id = "post-apply-handoff"
regex = "/opsx:archive"
action = "continue"
next = "/opsx:archive"

# Explore closings are free-form thinking summaries; the stable family signal
# across observed runs is the reference to the upcoming proposal (run 1: "spin
# up an OpenSpec change proposal"; run 2: "calibration run — proposal → spec →
# tasks"). Unfamiliar phrasings fall to the learning mode (ask-once-remembered).
[[patterns]]
id = "post-explore-handoff"
regex = "(?i)proposal"
action = "continue"
next = "/opsx:propose"

# ---- v1.0 rows (non-opsx flows; kept unchanged) ----

[[patterns]]
id = "impl-complete"
regex = "Implementation Complete.*ready for review"
action = "continue"

[[patterns]]
id = "spec-done"
regex = "(?i)specification.*finalized"
action = "continue"

[[patterns]]
id = "changes-proposed"
regex = "(?i)change proposal.*ready"
action = "hook"

[[handoff_tools]]
id = "os-handoff"
tool = "openspec_handoff"
action = "continue"

[[handoff_tools]]
id = "os-stage-done"
tool = "openspec_stage_done"
action = "continue"

# ---- read-only surface (probe-pinned v1.5.0) ----

[commands.list]
mutability = "read-only"
timeout_secs = 60

[commands.show]
mutability = "read-only"
timeout_secs = 60

[commands.validate]
mutability = "read-only"
timeout_secs = 60
exit_class = "fixable" # validation findings are actionable, not hard errors

[commands.status]
mutability = "read-only"
timeout_secs = 60

[commands.instructions]
mutability = "read-only"
timeout_secs = 60

[commands.context]
mutability = "read-only"
timeout_secs = 120 # --code-workspace runs can be long (probe-observed)

[commands.doctor]
mutability = "read-only"
timeout_secs = 60
exit_class = "fixable" # health findings surface as actionable results

[commands.templates]
mutability = "read-only"
timeout_secs = 60

[commands.schemas]
mutability = "read-only"
timeout_secs = 60

[commands.spec]
mutability = "read-only"
timeout_secs = 60 # spec show|list|validate read subcommands

[commands.change]
mutability = "read-only"
timeout_secs = 60 # change show|validate (change list is DEPRECATED upstream)

# ---- mutating surface (probe-pinned v1.5.0) ----

[commands.archive]
mutability = "mutating"
timeout_secs = 60
exit_class = "fixable" # a blocked archive (incomplete tasks) is actionable

[commands.new-change]
argv = "new change"
mutability = "mutating"
timeout_secs = 60

[commands.init]
mutability = "mutating"
timeout_secs = 120 # writes instruction files (+ optional tool scaffolding)

[commands.update]
mutability = "mutating"
timeout_secs = 120 # rewrites instruction files across the tree

[commands.config-set]
argv = "config set"
mutability = "mutating"
timeout_secs = 60

[commands.config-unset]
argv = "config unset"
mutability = "mutating"
timeout_secs = 60

[commands.config-reset]
argv = "config reset"
mutability = "mutating"
timeout_secs = 60

[commands.schema-fork]
argv = "schema fork"
mutability = "mutating"
timeout_secs = 60

[commands.schema-init]
argv = "schema init"
mutability = "mutating"
timeout_secs = 60

[commands.store-setup]
argv = "store setup"
mutability = "mutating"
timeout_secs = 120 # store provisioning can hit the network

[commands.store-register]
argv = "store register"
mutability = "mutating"
timeout_secs = 60

[commands.store-unregister]
argv = "store unregister"
mutability = "mutating"
timeout_secs = 60

[commands.store-remove]
argv = "store remove"
mutability = "mutating"
timeout_secs = 60

[commands.workset-create]
argv = "workset create"
mutability = "mutating"
timeout_secs = 60

[commands.workset-remove]
argv = "workset remove"
mutability = "mutating"
timeout_secs = 60

# Command-level mutability for DISCOVERED slash-commands (08-04 D-11): the
# v1.0 mutability discipline extended from tools to commands. A "mutating"
# command opens a context boundary AT EXPANSION TIME (cause
# "mutating-command:<key>"); "read-only" — and any key absent here — never
# does. Keys are ecosystem command keys (the "<ns>:<name>" form `openspec
# init --tools claude` installs). Classification mirrors write semantics: the
# stages that write openspec/ artifacts are mutating; explore only reads.
# Operator overlays flip entries per the normal loader precedence.
[command_mutability]
"opsx:explore" = "read-only"
"opsx:propose" = "mutating"
"opsx:apply" = "mutating"
"opsx:sync" = "mutating"
"opsx:update" = "mutating"
"opsx:archive" = "mutating"

# seeded.toml — the embedded zero-config OpenSpec config floor (OPEN-02). The
# engine loads this default when no operator overlay is present; operators
# override via the TOML loader. Seeded from real OpenSpec handoff examples.
#
# [[patterns]] — assistant-text regex → action (the engine's dual-signal text
#   half, D-02). The engine continues the SDD scenario when the assistant's
#   output matches one of these handoff patterns. (08-06 owns re-seeding these
#   from captured real stage-end output.)
#
#   08-06 chaining row format (D-12) — ids are stage-bearing and rows carry
#   the next /opsx:* command injected on match (the injection expands through
#   the 08-04 seam: provenance + mutating-command boundary like a typed
#   command):
#
#   [[patterns]]
#   id = "post-propose-handoff"          # post-<stage>-... selects the hook stage
#   regex = "<from CAPTURED stage-end output, never command-file prose>"
#   action = "continue"
#   next = "/opsx:apply"                 # empty = the generic continue prompt
#
#   The final archive stage matches NOTHING (the chain ends naturally).
#
#   [[command_patterns]] — hybrid chaining (findings-6 disposition): a registry
#   command key whose expansion STARTED a turn carries an action when the turn
#   completes. Consulted ONLY after the text/tool signals miss — the
#   deterministic boundaries stay regex-chained. Same id/next conventions:
#
#   [[command_patterns]]
#   id = "post-explore-handoff"       # stage-bearing; selects the hook stage
#   command = "opsx:explore"          # the registry key that started the turn
#   action = "continue"
#   next = "/opsx:propose"
# [[handoff_tools]] — tool-call name → action (the dual-signal tool half).
# [commands] — command → classification (D-15 / OPEN-03, the boundary source of
#   truth). Every entry runs as a subprocess via the Adapter with
#   OPEN_SPEC_INTERACTIVE=0 + nil stdin + per-command timeout.
#
# [commands] SOURCE OF TRUTH: the INSTALLED binary's probe (v1.5.0 on this
# machine, captured 2026-08-14 from `openspec --help` — NEVER the moving npm
# main, whose surface differs). Keys are hyphenated tool-name suffixes; `argv`
# carries the exact subprocess argv prefix when it differs from the key
# (e.g. key "new-change" → argv "new change"). Human-only commands (view,
# workset open, config edit, feedback, completion) are NEVER registered.
# RE-PROBE PROCEDURE on binary upgrades: run
#   ASSGUARD_OPENSPEC_BIN=1 go test ./internal/openspec/ -run TestSurfaceMatchesInstalledBinary
# — a mismatch fails with a diff naming the stale entries (Pitfall 7.2).

# ---- 08-06 T3 chaining rows — RE-SEEDED FROM THE REAL CAPTURE (D-12) ----
# Source: cmd/ass-guard/testdata/opsx-e2e/stage-{1,2,3}-output-capture.txt
# Capture run: 2026-08-15T13:29Z, gated E2E capture mode (real openspec 1.5.0
# binary + real GLM-5.2 via the Z.ai Anthropic endpoint), full
# explore→propose→apply→archive scenario, 505s. RE-TUNED 2026-08-20 (13-01
# Task 1) against the 12-08 drift evidence (three runs 2026-08-20, preserved
# at .planning/phases/13-openspec-workflow-completion/13-01-eval-first-runs/):
# the bare-command anchors drifted — the apply stage's own banner echo
# `(override with `/opsx:apply <other>`)` matches a bare `/opsx:apply` regex,
# so the apply turn's ending re-fired the →apply injection until the budget
# cap (run 3's loop). The anchors now pin the STAGE-CLOSING phrasings the
# model emits across ALL observed runs (2026-08-15 captures + 2026-08-20
# evidence): propose closes with "Run `/opsx:apply` … to start …"; apply
# closes with "… archiv(e|ed)( this change)? with `/opsx:archive`". The
# explore boundary chains on COMMAND PROVENANCE (see [[command_patterns]]
# below). Row ORDER among the text rows is first-match-wins; the
# archive-terminal shield leads so an archive closing can never chain.
# Operator overlays adjust without code (D-12).

# The terminal shield: the archive closing ends the chain (wait = no injection,
# flows through unchanged).
[[patterns]]
id = "post-archive-terminal"
regex = "(?i)archive complete"
action = "wait"

[[patterns]]
id = "post-propose-handoff"
regex = "(?i)run `?/opsx:apply`?[^.]*to (start|begin|implement)"
action = "continue"
next = "/opsx:apply"

[[patterns]]
id = "post-apply-handoff"
regex = "(?i)archiv(e|ed)( this change)? with `?/opsx:archive`?"
action = "continue"
next = "/opsx:archive"

# ---- hybrid chaining: the explore boundary (findings-6 disposition,
# 2026-08-15) ----
# The /opsx:explore closing is architecturally FREE-FORM — the toolkit's own
# command guardrails mandate it ("Don't force structure — let patterns emerge
# naturally"). Four live gated closings took four structurally different forms
# (proposal-handoff / calibration-run / open-question-with-"Proposed" / pure
# Socratic question with ZERO propos* occurrences — evidence: the four runs
# cited in STATE.md's 6th finding); no text regex chains them honestly, and
# widening further was the hollow green the gates exist to prevent. The former
# `(?i)propos` text row is therefore REPLACED by a COMMAND-PROVENANCE row: a
# turn STARTED by the expanded opsx:explore command chains to /opsx:propose on
# completion — deterministic (the command key is recorded by the 08-04
# expansion seam), mirrors D-11's command vocabulary, and is structurally
# unspoofable from model-visible content (the key never comes from
# assistant/tool text). The engine consults provenance ONLY after the text/tool
# signals miss; the capture-seeded rows above stay authoritative for
# propose/apply/archive (no command rows exist for those keys).
[[command_patterns]]
id = "post-explore-handoff"
command = "opsx:explore"
action = "continue"
next = "/opsx:propose"


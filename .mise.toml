[tools]
go = "1.26"
golangci-lint = "2"

[env]
# Ensure Go test/build output is deterministic
GOFLAGS = "-trimpath"

[tasks.build]
description = "Build all packages (CGO disabled for static binary)"
run = "CGO_ENABLED=0 go build ./..."

[tasks.test]
description = "Run all tests with race detector"
run = "go test -race -count=1 ./..."

[tasks.lint]
description = "Run golangci-lint v2 with strict config"
run = "golangci-lint run"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.ci]
description = "Run the full CI gate: vet + lint + build + test"
depends = ["vet", "lint", "build", "test"]

# 12-08 (D-03) — the behavioral-eval gate surface. NONE of these joined
# `ci` (D-03: the suites gate on the locked change classes via
# eval-check-changed, not every commit; ci keeps its fast deterministic set).
[tasks.eval-gate]
description = "Run the behavioral-eval scenario suites at k=1 behind the gate flags (real binary + real model, ~8-10 min)"
run = "ASSGUARD_EVAL_GATE=1 ASSGUARD_OPENSPEC_BIN=1 ASSGUARD_E2E_LLM=1 go test ./cmd/ass-guard/ -count=1 -run TestEvalSuite_Flagship_Gated -timeout 15m -v"

[tasks.eval-deep]
description = "Manual/local deep pass: k=3 over the suite (NOT in the gate — D-03)"
run = "ASSGUARD_EVAL_GATE=1 ASSGUARD_OPENSPEC_BIN=1 ASSGUARD_E2E_LLM=1 go test ./cmd/ass-guard/ -count=1 -run TestEvalSuite_Flagship_Deep -timeout 45m -v"

[tasks.eval-check-changed]
description = "Detector: do the changes touch the locked eval-gate change classes? (exit 3 => run mise eval-gate)"
run = "./scripts/eval-change-class.sh"

# 24-04 (TAIL-02, D-08/D-09) — the nightly upstream-parity drift gate's
# runner entry: the workflow's self-hosted drift job invokes exactly this
# task (the zcode corpus lives on that runner). Drift-only light path
# (OQ3): probe + structure hash vs the pinned capture + this build —
# ZERO API spend; the behavioral-eval suites stay on their own locked
# change-class gate (D-09, never merged in here). Exit contract the
# workflow maps: 0 parity / 7 drift (auto-issue) / 1 operational.
[tasks.parity-nightly]
description = "Nightly upstream-parity drift gate: build + parity nightly-check vs the committed structure pin (exit 7 on drift)"
run = "CGO_ENABLED=0 go build -o /tmp/ass-guard-parity-nightly ./cmd/ass-guard && /tmp/ass-guard-parity-nightly parity nightly-check --profiles-dir profiles/zcode --pin profiles/zcode/structure-pin.json --report nightly-report.json"

# 16-06 (D-04): the adversarial TurnEmitter soak — MINUTES of chaotic
# producers and a stuttering writer standing behind the seconds-scale ci
# stress. Env-gated exactly like the eval lane: the test SKIPS (never fails)
# with the flag unset, so `ci` stays fast by construction. Override the
# duration for longer nightly runs via ASSGUARD_EMITTER_SOAK_DURATION.
[tasks.emitter-soak]
description = "Adversarial emitter soak (2min default; NOT part of ci)"
run = "ASSGUARD_EMITTER_SOAK=1 go test ./internal/acp/ -run TestTurnEmitterSoak -count=1 -timeout 10m -v"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.fmt]
description = "Format all Go files"
run = "gofmt -w ."

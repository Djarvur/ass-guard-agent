# base_layering.yaml — the global/base layer for TestLoadLayering. Declares a
# full valid config with timezone Europe/London, heavy→glm-5.2, good→glm-4.6.
timezone: "Europe/London"

providers:
  anthropic:
    base_url: "https://api.z.ai/api/anthropic"
    shape: anthropic
  openai:
    base_url: "https://api.openai.com/v1"
    shape: openai

models:
  glm-5.2:
    provider: anthropic
    pricing: { input_per_mtoken: 0.60, output_per_mtoken: 2.20 }
    capabilities: { context_window: 200000, max_output_tokens: 32000, tool_calling: true, streaming: true, extended_thinking: true }
  glm-4.6:
    provider: anthropic
    pricing: { input_per_mtoken: 0.15, output_per_mtoken: 0.60 }
    capabilities: { context_window: 128000, max_output_tokens: 16000, tool_calling: true, streaming: true, extended_thinking: false }
  minimax-m3:
    provider: openai
    pricing: { input_per_mtoken: 0.10, output_per_mtoken: 0.30 }
    capabilities: { context_window: 200000, max_output_tokens: 32000, tool_calling: true, streaming: true, extended_thinking: true }

tiers:
  heavy:
    model: glm-5.2
    fallback: [minimax-m3]
  good:
    model: glm-4.6
    fallback: []

circuit_breaker:
  consecutive_failures: 5
  error_rate_window: 20
  error_rate_threshold: 0.50
  cooldown: 60s
  half_open_probes: 1

cost_ceiling:
  amount_usd: 50.0
  window: 24h
  degrade_to: good
